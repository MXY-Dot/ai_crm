services:
  crm:
    build:
      context: .
      args:
        INSTALL_DEV: "${INSTALL_DEV:-false}"
        VITE_APP_NAME: "${VITE_APP_NAME:-Gravity AI CRM}"
    image: gravity-ai-crm:local
    container_name: gravity-ai-crm
    env_file:
      - .env
    environment:
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ai_crm}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-root}"
      CHATWOOT_URL: "${DOCKER_CHATWOOT_URL:-http://host.docker.internal:3000}"
      DIFY_API_URL: "${DOCKER_DIFY_API_URL:-http://host.docker.internal:8080/v1}"
      WAIT_FOR_DB: "${WAIT_FOR_DB:-false}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
      CACHE_CONFIG: "${CACHE_CONFIG:-false}"
    ports:
      - "${CRM_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - crm-storage:/var/www/html/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: gravity-ai-crm-mysql
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ai_crm}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-root}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - crm-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  crm-mysql:
  crm-storage: